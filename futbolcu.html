</style></head><body><div class="top"></div><header><div class="wrap nav"><a class="brand" href="index.html">GS1905<small>ASLANIN YUVASI</small></a><a class="back" href="kadro.html">← KADROYA DÖN</a></div></header><main class="wrap" id="content"></main><footer><div class="wrap">GS1905 · Bağımsız taraftar konsepti · Resmî kulüp sitesi değildir.</div></footer><script>
const name=new URLSearchParams(location.search).get('id');const root=document.getElementById('content');
fetch('data/players.json').then(r=>{if(!r.ok)throw Error('Kadro verisi yüklenemedi');return r.json()}).then(d=>{const p=d.players.find(x=>x.name===name);if(!p){root.innerHTML='<div class="notfound"><h1>Futbolcu bulunamadı</h1><a href="kadro.html">Kadroya dön</a></div>';return}document.title=p.name+' | GS1905';root.innerHTML='<section class="profile"><div class="portrait">'+(p.photo?'<img src="'+p.photo+'" alt="'+p.name+' fotoğrafı" onerror="this.style.display=\'none\'">':'<span class="fallback">GS</span>')+'<span class="number">#'+p.number+'</span></div><div><div class="eyebrow">GALATASARAY · FUTBOL A TAKIMI</div><h1 class="name">'+p.name+'</h1><div class="role">'+p.position+'</div><p class="intro">Galatasaray Futbol A Takımı oyuncu profili. Aşağıdaki kişisel bilgiler ve kariyer özeti, oyuncu için kayıtlı kaynak bağlantılarından doğrulanabilen verilerle sınırlıdır.</p><div class="facts"><div class="fact"><small>FORMA NUMARASI</small><strong>#'+p.number+'</strong></div><div class="fact"><small>MEVKİ</small><strong>'+p.position+'</strong></div><div class="fact"><small>TAKIM</small><strong>Galatasaray A Takım</strong></div>'+((p.details&&p.details.birthDate)?'<div class="fact"><small>DOĞUM TARİHİ</small><strong>'+new Date(p.details.birthDate+'T12:00:00').toLocaleDateString('tr-TR')+'</strong></div>':'')+((p.details&&p.details.birthPlace)?'<div class="fact"><small>DOĞUM YERİ</small><strong>'+p.details.birthPlace+'</strong></div>':'')+((p.details&&p.details.nationality)?'<div class="fact"><small>UYRUK</small><strong>'+p.details.nationality+'</strong></div>':'')+((p.details&&p.details.heightCm)?'<div class="fact"><small>BOY</small><strong>'+p.details.heightCm+' cm</strong></div>':'')+'</div>'+(p.details&&p.details.career?'<section style="margin-top:28px"><div class="eyebrow">KARİYER</div><p class="intro" style="margin:12px 0">'+p.details.career.join(' → ')+'</p></section>':'')+'<p class="disclaimer">Kadro kaynağı: <a href="'+d.source+'" target="_blank" rel="noopener">Galatasaray resmî A Takım kadrosu ↗</a>. Portre fotoğrafı kaynağı: beIN SPORTS. '+(p.details&&p.details.sources?'Oyuncu bilgileri: '+p.details.sources.map((s,i)=>'<a href="'+s+'" target="_blank" rel="noopener">Kaynak '+(i+1)+' ↗</a>').join(' · '):'Bu oyuncu için biyografik bilgiler henüz doğrulanmadı.')+' Sezon verileri: <a href="istatistikler.html">2026/27 oyuncu istatistikleri ↗</a>.</p><a class="back" href="kadro.html">← TÜM FUTBOLCULAR</a></div></section>'}).catch(()=>{root.innerHTML='<div class="notfound"><h1>Oyuncu bilgileri yüklenemedi</h1><a href="kadro.html">Kadroya dön</a></div>'});
</script></body></html>
