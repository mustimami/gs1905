tasaray resmî A Takım kadrosu ↗</a>. Portre fotoğrafı kaynağı: beIN SPORTS. '+(p.details&&p.details.sources?'Oyuncu bilgileri: '+p.details.sources.map((s,i)=>'<a href="'+s+'" target="_blank" rel="noopener">Kaynak '+(i+1)+' ↗</a>').join(' · '):'Bu oyuncu için biyografik bilgiler henüz doğrulanmadı.')+' Sezon verileri: <a href="istatistikler.html">2026/27 oyuncu istatistikleri ↗</a>.</p>'+(p.seasonStats?'<section style="margin:26px 0"><div class="eyebrow">2026/27 SÜPER LİG İSTATİSTİKLERİ</div><div class="facts" style="margin-top:12px"><div class="fact"><small>MAÇ</small><strong>'+p.seasonStats.matches+'</strong></div><div class="fact"><small>GOL</small><strong>'+p.seasonStats.goals+'</strong></div><div class="fact"><small>ASİST</small><strong>'+p.seasonStats.assists+'</strong></div><div class="fact"><small>SARI KART</small><strong>'+p.seasonStats.yellowCards+'</strong></div><div class="fact"><small>KIRMIZI KART</small><strong>'+p.seasonStats.redCards+'</strong></div></div><p class="meta" style="margin-top:10px">Kaynak: <a href="'+p.seasonStats.source+'" target="_blank" rel="noopener">beIN SPORTS ↗</a> · Güncelleme: '+p.seasonStats.asOf+'</p></section>':'')+'<p class="disclaimer">GS1905 bağımsız taraftar konseptidir; resmî kulüp sitesi değildir.</p><a class="back" href="kadro.html">← TÜM FUTBOLCULAR</a></div></section>'}).catch(()=>{root.innerHTML='<div class="notfound"><h1>Oyuncu bilgileri yüklenemedi</h1><a href="kadro.html">Kadroya dön</a></div>'});
