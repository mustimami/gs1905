</style><script>const I={shirt:'<path d="m8 4 4 2 4-2 5 3-3 4-2-1v10H8V10l-2 1-3-4z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87"/>',goal:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',flag:'<path d="M5 21V4m0 1c7-4 9 4 15 0v11c-6 4-8-4-15 0"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',height:'<path d="M4 20 20 4M7 4h13v13M4 7v-3h3"/>',ball:'<circle cx="12" cy="12" r="9"/><path d="m12 3 3 6-3 6-6 1-3-4m12-3 6 1m-15 5 1 6 5 2 3-5"/>',chart:'<path d="M3 3v18h18M7 14l4-4 3 3 6-7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'};function ic(n){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||I.ball)+'</svg>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const name=new URLSearchParams(location.search).get('id');const root=document.getElementById('content');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fact(icon,label,value){return '<div class="profile-fact">'+ic(icon)+'<small>'+label+'</small><b>'+esc(value)+'</b></div>'}fetch('data/players.json').then(r=>r.json()).then(d=>{const p=(d.players||[]).find(x=>x.name===name);if(!p){root.innerHTML='<div class="empty">Futbolcu bulunamadı. <a href="kadro.html">Kadroya dön ↗</a></div>';return}document.title=p.name+' | GS1905';const det=p.details||{},st=p.seasonStats||{};c eer.length?'<section class="profile-section"><h2>'+ic('trophy')+' KARİYER YOLCULUĞU</h2><div class="career-list">'+det.career.map((x,i)=>'<span>'+esc(x)+'</span>'+(i<det.career.length-1?'<i>→</i>':'')).join('')+'</div></section>':'')+'<p class="source-note">Bilgi kaynakları: '+(det.sources&&det.sources.length?det.sources.map((x,i)=>'<a href="'+esc(x)+'" target="_blank" rel="noopener">Kaynak '+(i+1)+' ↗</a>').join(' · '):'<a href="'+esc(d.source)+'" target="_blank" rel="noopener">Galatasaray resmî kadro sayfası ↗</a>')+'. Portre kaynağı: '+esc(p.photoSource||'Belirtilmedi')+'. GS1905 bağımsız taraftar platformudur.</p>'}).catch(()=>root.innerHTML='<div class="empty">Oyuncu bilgileri yüklenemedi. <a href="kadro.html">Kadroya dön</a></div>');</script>
